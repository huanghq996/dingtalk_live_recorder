# 相对路径以本文件所在目录为基准；留空时使用 recordings。
output_dir: recordings

# 从上到下为直播选择优先级。
target_groups:
  - 小品种
  - Lcai学员群14
  - 公司群

# 每轮扫描完成后的等待时间，单位为秒。
scan_interval_seconds: 15

# 视频编码器：auto 优先使用 NVIDIA GPU（NVENC），不可用时回退到 CPU；也可设为 libx264 或 h264_nvenc。
recording:
  video_encoder: auto

log:
  # 留空时使用 logs。
  directory: logs
  retention_days: 30
